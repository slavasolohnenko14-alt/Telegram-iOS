name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: e5762bd9c88eadb22442d90057ff4b6cf3c844cb
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Create config
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          jq --arg id "$TG_API_ID" --arg hash "$TG_API_HASH" \
            '.api_id = $id | .api_hash = $hash' \
            build-system/appstore-configuration.json > "$RUNNER_TEMP/config.json"

      - name: Import certificates
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs || true

      - name: Build
        run: |
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/bazel-cache" \
            build \
            --configurationPath="$RUNNER_TEMP/config.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64

      - name: Collect IPA
        run: |
          mkdir -p build/artifacts
          IPA=$(find -L bazel-out -name Telegram.ipa 2>/dev/null | head -n1)
          echo "found: $IPA"
          cp "$IPA" build/artifacts/Telegram.ipa
          ls -la build/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: build/artifacts/Telegram.ipa
