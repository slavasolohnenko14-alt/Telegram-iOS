name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Fill missing profiles
        run: |
          DIR=build-system/fake-codesigning/profiles
          echo "Profiles before:"
          ls -1 "$DIR"
          for NAME in Telegram Share Widget NotificationContent NotificationService Intents BroadcastUpload WatchApp WatchExtension; do
            if [ ! -f "$DIR/$NAME.mobileprovision" ]; then
              echo "Missing $NAME, copying from Telegram"
              cp "$DIR/Telegram.mobileprovision" "$DIR/$NAME.mobileprovision"
            fi
          done
          echo "Profiles after:"
          ls -1 "$DIR"

      - name: Create config
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          PROFILE=build-system/fake-codesigning/profiles/Telegram.mobileprovision
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          TEAM_ID="${APP_ID%%.*}"
          BUNDLE_ID="${APP_ID#*.}"
          echo "team_id=$TEAM_ID bundle_id=$BUNDLE_ID"
          cp build-system/template_minimal_development_configuration.json "$RUNNER_TEMP/config.json"
          jq --arg id "$TG_API_ID" --arg hash "$TG_API_HASH" \
            --arg team "$TEAM_ID" --arg bundle "$BUNDLE_ID" \
            '.api_id = $id | .api_hash = $hash | .team_id = $team | .bundle_id = $bundle' \
            "$RUNNER_TEMP/config.json" > "$RUNNER_TEMP/config2.json"
          mv "$RUNNER_TEMP/config2.json" "$RUNNER_TEMP/config.json"

      - name: Build
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/bazel-cache" \
            build \
            --configurationPath="$RUNNER_TEMP/config.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64

      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: bazel-bin/Telegram/Telegram.ipa
