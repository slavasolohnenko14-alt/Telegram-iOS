name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: e5762bd9c88eadb22442d90057ff4b6cf3c844cb
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Download iOS platform
        run: |
          xcrun simctl list runtimes
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes

      - name: Create config
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          jq --arg id "$TG_API_ID" --arg hash "$TG_API_HASH" \
            '.api_id = $id | .api_hash = $hash' \
            build-system/appstore-configuration.json > "$RUNNER_TEMP/config.json"

      - name: Import certificates
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs || true

      - name: Create BroadcastUpload profile
        run: |
          set -e
          DIR=build-system/fake-codesigning/profiles
          TEAM=$(jq -r .team_id "$RUNNER_TEMP/config.json")
          BUNDLE=$(jq -r .bundle_id "$RUNNER_TEMP/config.json")
          echo "team=$TEAM bundle=$BUNDLE"
          openssl smime -inform der -verify -noverify -in "$DIR/Share.mobileprovision" -out "$RUNNER_TEMP/share.plist"
          TEAM="$TEAM" BUNDLE="$BUNDLE" python3 - <<'PY'
          import os, plistlib, uuid
          tmp = os.environ["RUNNER_TEMP"]
          with open(tmp + "/share.plist", "rb") as f:
              p = plistlib.load(f)
          p["Entitlements"]["application-identifier"] = os.environ["TEAM"] + "." + os.environ["BUNDLE"] + ".BroadcastUpload"
          p["Name"] = "BroadcastUpload"
          p["AppIDName"] = "BroadcastUpload"
          p["UUID"] = str(uuid.uuid4()).upper()
          with open(tmp + "/bu.plist", "wb") as f:
              plistlib.dump(p, f, fmt=plistlib.FMT_XML)
          PY
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/k.pem" -out "$RUNNER_TEMP/c.pem" -subj "/CN=fake" -days 3650
          openssl smime -sign -binary -nodetach -signer "$RUNNER_TEMP/c.pem" -inkey "$RUNNER_TEMP/k.pem" -in "$RUNNER_TEMP/bu.plist" -outform der -out "$DIR/BroadcastUpload.mobileprovision"
          echo "--- check ---"
          openssl smime -inform der -verify -noverify -in "$DIR/BroadcastUpload.mobileprovision" | grep -A1 application-identifier
          ls -1 "$DIR"

      - name: Build
        run: |
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/bazel-cache" \
            build \
            --configurationPath="$RUNNER_TEMP/config.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64

      - name: Collect IPA
        run: |
          mkdir -p build/artifacts
          IPA=$(find -L bazel-out -name Telegram.ipa 2>/dev/null | head -n1)
          echo "found: $IPA"
          cp "$IPA" build/artifacts/Telegram.ipa
          ls -la build/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: build/artifacts/Telegram.ipa
